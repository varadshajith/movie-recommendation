<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel - Movie Watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Reel</h1>
    <!-- Search form: text box + button -->
    <form id="search-form">
      <input type="text" id="query" placeholder="Search movies...">
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <!-- Messages (like errors) appear here -->
    <p id="message"></p>

    <section>
      <h2>Search Results</h2>
      <div id="results" class="grid"></div>
    </section>

    <section>
      <h2>My Watchlist</h2>
      <div id="watchlist" class="grid"></div>
    </section>
  </main>

  <footer>
    <p>Reel - data from TMDB</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
