<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel — log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
<!-- React renders the whole login card into this div -->
<div id="root"></div>

<!-- React + JSX compiler loaded from a CDN: no build step needed for this page -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const API = `http://${location.hostname}:8181`;

// A labelled input. Props: label, type, value, onChange, autoComplete.
function Field({ label, type, value, onChange, autoComplete }) {
  return (
    <label className="field">
      {label}
      <input type={type} value={value} autoComplete={autoComplete} required
             onChange={(e) => onChange(e.target.value)} />
    </label>
  );
}

function LoginPage() {
  const [mode, setMode] = useState('login');         // 'login' | 'register'
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const isRegister = mode === 'register';

  // Already logged in? Skip straight to the app.
  useEffect(() => {
    if (localStorage.getItem('reelToken')) location.replace('index.html');
  }, []);

  // Clear the old error whenever the user switches between login and register.
  useEffect(() => setError(''), [mode]);

  async function handleSubmit(e) {
    e.preventDefault();
    // same rules the server enforces, so the user gets instant feedback
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
      return setError('Username must be 3–20 letters, numbers or underscores.');
    }
    if (password.length < 6) return setError('Password must be at least 6 characters.');

    setBusy(true);
    setError('');
    try {
      const res = await fetch(`${API}/api/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      localStorage.setItem('reelToken', data.token);
      localStorage.setItem('reelUser', data.username);
      location.replace('index.html');
    } catch (err) {
      // fetch() itself failing means the server is not running
      setError(err instanceof TypeError ? 'Cannot reach the server. Run "npm start" in reel-backend.' : err.message);
      setBusy(false);
    }
  }

  return (
    <main className="login-wrap">
      <section className="login-card glass" aria-labelledby="title">
        <h1 id="title">{isRegister ? <>Join <em>Reel.</em></> : <>Welcome <em>back.</em></>}</h1>
        <p className="sub">
          {isRegister ? 'Create an account to keep your own taste profile.' : 'Log in to pick up your swiping where you left off.'}
        </p>

        <form onSubmit={handleSubmit} noValidate>
          <Field label="Username" type="text" value={username} onChange={setUsername} autoComplete="username" />
          <Field label="Password" type="password" value={password} onChange={setPassword}
                 autoComplete={isRegister ? 'new-password' : 'current-password'} />

          {error && <div className="form-error" role="alert">{error}</div>}

          <button className="btn" type="submit" disabled={busy}>
            {busy ? 'Please wait…' : isRegister ? 'Create account' : 'Log in'}
          </button>
        </form>

        <button className="link-btn" type="button" onClick={() => setMode(isRegister ? 'login' : 'register')}>
          {isRegister ? 'Already have an account? Log in' : 'New here? Create an account'}
        </button>
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage />);
</script>
</body>
</html>
