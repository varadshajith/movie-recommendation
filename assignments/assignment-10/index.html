<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel — Fetch API</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>Reel <em>Search</em></h1>
  <p class="sub">Search TV shows. Data is fetched as JSON from the public TVmaze API (no key needed).</p>

  <form id="searchForm">
    <input id="q" placeholder="e.g. Breaking Bad, Dark, Office" value="dark" autocomplete="off">
    <button>Search</button>
  </form>

  <p id="status" class="sub"></p>
  <div id="results" class="grid"></div>

  <h2>Our picks <small class="sub">(fetched from local <code>picks.json</code>)</small></h2>
  <ul id="picks" class="list"></ul>
</main>
<script src="script.js"></script>
</body>
</html>
